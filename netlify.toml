# netlify.toml

[build]
  command = "npm install -g hugo-extended && hugo --gc --minify -b $URL"
  publish = "public"

[build.environment]
  NODE_ENV = "production"
  GO_VERSION = "1.16"
  TZ = "UTC"  # Set to preferred timezone
  HUGO_VERSION = "0.140.0"

[context.production.environment]
  HUGO_VERSION = "0.140.0"
  HUGO_ENV = "production"

[context.deploy-preview.environment]
  HUGO_VERSION = "0.140.0"